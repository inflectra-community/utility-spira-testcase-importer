<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spira Test Case Importer</title>
<style>
  :root {
    --teal: #073640;
    --teal-light: #0d5563;
    --yolk: #FDCB26;
    --ink: #1a1a1a;
    --paper: #f4f6f7;
    --line: #d9e0e2;
    --ok: #2e7d32;
    --warn: #b26a00;
    --err: #c62828;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Nunito", "Segoe UI", system-ui, sans-serif;
    background: var(--paper); color: var(--ink);
  }
  header {
    background: var(--teal); color: #fff; padding: 16px 24px;
    display: flex; align-items: center; gap: 12px;
  }
  header .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--yolk); }
  header h1 { font-size: 18px; margin: 0; font-weight: 700; }
  nav { display: flex; gap: 4px; background: var(--teal-light); padding: 0 24px; }
  nav button {
    background: none; border: none; color: #cfe3e7; padding: 12px 18px;
    cursor: pointer; font-size: 14px; font-weight: 600; border-bottom: 3px solid transparent;
  }
  nav button.active { color: #fff; border-bottom-color: var(--yolk); }
  main { max-width: 860px; margin: 24px auto; padding: 0 24px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 20px; margin-bottom: 18px; }
  .card h2 { margin: 0 0 14px; font-size: 16px; color: var(--teal); }
  label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
  input, select {
    width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px;
    font-size: 14px; font-family: inherit;
  }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  button.primary {
    background: var(--teal); color: #fff; border: none; padding: 10px 18px;
    border-radius: 6px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 14px;
  }
  button.primary:disabled { opacity: .5; cursor: not-allowed; }
  button.ghost {
    background: #fff; color: var(--teal); border: 1px solid var(--teal); padding: 8px 14px;
    border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px;
  }
  .hidden { display: none; }
  .status { padding: 10px 12px; border-radius: 6px; font-size: 13px; margin-top: 12px; }
  .status.ok { background: #e7f3e8; color: var(--ok); }
  .status.err { background: #fdecea; color: var(--err); }
  .status.warn { background: #fff4e0; color: var(--warn); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--teal); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  .file-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 6px; cursor: pointer; }
  .file-item:hover { border-color: var(--teal); }
  .file-item.selected { border-color: var(--teal); background: #eef5f6; }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: var(--yolk); color: var(--ink); }
  .muted { color: #667; font-size: 12px; }
  .progress-track { background: var(--line); border-radius: 6px; height: 10px; overflow: hidden; margin: 10px 0; }
  .progress-bar { background: var(--teal); height: 100%; width: 0; transition: width .2s; }
  .log { font-family: ui-monospace, "Cascadia Code", monospace; font-size: 12px; background: #06282f; color: #cfe3e7; padding: 12px; border-radius: 6px; max-height: 220px; overflow: auto; white-space: pre-wrap; }
  .pill { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #eef5f6; color: var(--teal); margin-left: 6px; }
  .member-order { counter-reset: m; }
  .member-order li { margin: 2px 0; }
</style>
</head>
<body>
<header><span class="dot"></span><h1>Spira Test Case Importer</h1></header>
<nav>
  <button data-tab="settings" class="active">Settings</button>
  <button data-tab="import">Import</button>
</nav>
<main>
  <!-- SETTINGS -->
  <section id="tab-settings">
    <div class="card">
      <h2>Spira Connection</h2>
      <label>Base URL</label>
      <input id="spiraUrl" placeholder="https://mycompany.spiraservice.net" />
      <div class="row">
        <div><label>Username</label><input id="spiraUser" /></div>
        <div><label>Project ID</label><input id="spiraProject" type="number" /></div>
      </div>
      <label>API Key (RSS Token)</label>
      <input id="spiraKey" type="password" placeholder="{xxxxxxxx-xxxx-...}" />
      <label>Root Folder (optional — prefixes all imports)</label>
      <input id="rootFolder" placeholder="e.g. ZephyrImport" />
      <div>
        <button class="primary" id="saveSettings">Save</button>
        <button class="ghost" id="testConn" style="margin-left:8px;">Test Connection</button>
      </div>
      <div id="settingsStatus"></div>
    </div>
    <div class="card">
      <h2>LLM Provider <span class="pill">Excel imports only</span></h2>
      <div class="row">
        <div>
          <label>Provider</label>
          <select id="llmProvider">
            <option value="bedrock">AWS Bedrock</option>
            <option value="openai">OpenAI</option>
            <option value="anthropic">Anthropic</option>
          </select>
        </div>
        <div><label>Model</label><input id="llmModel" /></div>
      </div>
      <div class="row">
        <div><label>AWS Region (Bedrock)</label><input id="llmRegion" /></div>
        <div><label>API Key (OpenAI/Anthropic)</label><input id="llmKey" type="password" /></div>
      </div>
      <p class="muted">Zephyr bundles don't use the LLM — they map structurally.</p>
    </div>
  </section>

  <!-- IMPORT -->
  <section id="tab-import" class="hidden">
    <div class="card">
      <h2>1. Choose a source</h2>
      <p class="muted">Upload a Zephyr Scale bundle (zip the bundle folder) or select one already in <code>input/</code>.</p>
      <input type="file" id="fileInput" />
      <button class="ghost" id="uploadBtn" style="margin-top:8px;">Upload</button>
      <div id="fileList" style="margin-top:14px;"></div>
      <button class="primary" id="parseBtn" disabled>Parse &amp; Validate</button>
      <div id="parseStatus"></div>
    </div>

    <div class="card hidden" id="planCard">
      <h2>2. Review the plan</h2>
      <div id="planSummary"></div>
      <div id="planTestSet"></div>
      <table id="planTable"><thead><tr><th>Key</th><th>Name</th><th>Folder</th><th>Steps</th></tr></thead><tbody></tbody></table>
      <div style="margin-top:14px;">
        <button class="ghost" id="dryRunBtn">Dry Run</button>
        <button class="primary" id="importBtn" style="margin-left:8px;">Import to Spira</button>
      </div>
    </div>

    <div class="card hidden" id="progressCard">
      <h2>3. Progress</h2>
      <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
      <div id="progressText" class="muted"></div>
      <div class="log" id="log"></div>
      <div id="resultSummary"></div>
    </div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
